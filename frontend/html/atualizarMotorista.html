<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/sessao.js" defer></script>
    <script src="../js/atualizarMotorista.js" defer></script>
    <title>Atualizar Motorista - Logística Express</title>
</head>
<body>
    <header>
        <nav aria-label="Menu principal">
            <a href="../index.html">Home</a>&emsp;
            <span class="titulo_menu" id="funcionario_logado"></span>&emsp;
            <a href="#" id="logout">Logout</a>
        </nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Motorista</h1>
        <form>
            <label for="id">Código do Motorista</label><br>
            <input type="number" id="id" required><br><br>
            <label for="nome">Nome</label><br>
            <input type="text" id="nome" ><br><br>
            <label for="cnh">CNH</label><br>
            <input type="text" id="cnh" ><br><br>
            <label for="cpf">CPF (apenas 11 números)</label><br>
            <input type="text" id="cpf" maxlength="11"><br><br>
            <label for="telefone">Telefone</label><br>
            <input type="text" id="telefone" ><br><br>
            <button id="atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>

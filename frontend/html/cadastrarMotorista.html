<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/sessao.js" defer></script>
    <script src="../js/cadastrarMotorista.js" defer></script>
    <title>Cadastro de Motorista - Logística Express</title>
</head>
<body>
    <header>
        <nav aria-label="Menu principal">
            <a href="../index.html">Home</a>&emsp;
            <span class="titulo_menu" id="funcionario_logado"></span>&emsp;
            <a href="#" id="logout">Logout</a>
        </nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Motorista</h1>
        <form>
            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>
            <label for="cnh">CNH</label><br>
            <input type="text" id="cnh" required><br><br>
            <label for="cpf">CPF (apenas 11 números)</label><br>
            <input type="text" id="cpf" maxlength="11" required><br><br>
            <label for="telefone">Telefone</label><br>
            <input type="text" id="telefone" required><br><br>
            <button id="cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
